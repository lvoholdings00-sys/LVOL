<style>
:root {
  --black:       #0a0a0a;
  --surface:     #111111;
  --card:        #161616;
  --border:      #2a2a2a;
  --border-gold: #b8953f44;
  --gold:        #b8953f;
  --gold-light:  #d4a853;
  --gold-dim:    #7a5f1a;
  --gold-glow:   #b8953f18;
  --text:        #e8e6e0;
  --text-dim:    #9a9690;
  --text-muted:  #5a5650;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { font-size: 13px; }

body {
  background: var(--black);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.3;
}

#auth-container {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 100vh;
  padding: 40px 20px;
}

.auth-glow {
  position: absolute;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, #b8953f14 0%, transparent 70%);
  pointer-events: none;
  z-index: -1;
}

.auth-moth {
  width: 110px;
  height: 110px;
  margin-bottom: 28px;
  filter: drop-shadow(0 0 16px #b8953f22);
  animation: mothFloat 5s ease-in-out infinite;
}

@keyframes mothFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

.moth-wing-left, .moth-wing-right {
  transform-origin: 50% 55%;
  animation: wingBeat 4s ease-in-out infinite alternate;
}
.moth-wing-right { animation-direction: alternate-reverse; }

@keyframes wingBeat {
  0%   { transform: scaleX(1) rotate(-1deg); }
  100% { transform: scaleX(0.83) rotate(2deg); }
}

.auth-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 60px;
  font-weight: 300;
  letter-spacing: 0.45em;
  color: var(--gold);
  margin-bottom: 4px;
  text-indent: 0.45em;
  z-index: 1;
  position: relative;
}

.auth-subtitle {
  font-size: 9px;
  letter-spacing: 0.4em;
  color: var(--text-muted);
  margin-bottom: 40px;
  text-transform: uppercase;
  z-index: 1;
  position: relative;
}

#clerk-sign-in-container { 
  width: 360px; 
  max-width: 90vw; 
  z-index: 1;
  position: relative;
}

.auth-hint {
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 20px;
  z-index: 1;
  position: relative;
}

/* ═══════════════════════════════════════════
   CLERK OVERRIDES
═══════════════════════════════════════════ */
.cl-rootBox                      { font-family: 'DM Mono', monospace !important; }
.cl-card                         { background: transparent !important; border: 1px solid var(--border-gold) !important; border-radius: 0 !important; box-shadow: none !important; }
.cl-headerTitle                  { font-family: 'Cormorant Garamond', serif !important; font-weight: 300 !important; letter-spacing: 0.1em !important; color: var(--text) !important; }
.cl-headerSubtitle               { color: var(--text-muted) !important; font-size: 11px !important; }
.cl-formFieldLabel               { font-family: 'DM Mono', monospace !important; font-size: 9px !important; letter-spacing: 0.25em !important; color: var(--text-muted) !important; text-transform: uppercase !important; }
.cl-formFieldInput               { background: var(--card) !important; border: none !important; border-bottom: 1px solid var(--border) !important; border-radius: 0 !important; color: var(--text) !important; font-family: 'DM Mono', monospace !important; }
.cl-formFieldInput:focus         { border-bottom-color: var(--gold) !important; }
.cl-formButtonPrimary            { background: var(--gold) !important; color: var(--black) !important; border-radius: 0 !important; font-family: 'DM Mono', monospace !important; font-size: 10px !important; letter-spacing: 0.2em !important; text-transform: uppercase !important; box-shadow: none !important; }
.cl-formButtonPrimary:hover      { background: var(--gold-light) !important; }
.cl-footerActionLink             { color: var(--gold) !important; }
.cl-dividerLine                  { background: var(--border) !important; }
.cl-dividerText                  { color: var(--text-muted) !important; }
.cl-socialButtonsIconButton      { background: transparent !important; border: 1px solid var(--border) !important; border-radius: 0 !important; }
.cl-socialButtonsIconButton:hover{ border-color: var(--gold) !important; }
.cl-avatarBox                    { border-radius: 0 !important; border: 1px solid var(--border-gold) !important; }
</style>

<body>

<div id="auth-container">

      <path d="M63 57 Q80 45 98 52" stroke="#d4a853" stroke-width="0.7" fill="none" opacity="0.6"/>
      <path d="M63 62 Q78 58 92 65" stroke="#d4a853" stroke-width="0.5" fill="none" opacity="0.5"/>

    <circle cx="35" cy="60" r="5" fill="#0a0a0a" opacity="0.5"/>

  <div class="auth-title">L V O</div>
  <div class="auth-subtitle">Holdings LLC — Command Center</div>
  <div id="clerk-sign-in-container"></div>
  <div class="auth-hint" id="auth-loading-hint">Initializing secure access...</div>
</div>

<script>
const CLERK_ALLOWED_DOMAINS = ['lvo-cloud.cloud','dash.lvo-cloud.cloud','login.lvo-cloud.cloud','online.lvo-cloud.cloud'];
const DASHBOARD_URL = 'https://online.lvo-cloud.cloud';

const clerkAppearance = {
  // ... keep your existing appearance config unchanged
};

window.addEventListener('load', async () => {
  const loadingHint = document.getElementById('auth-loading-hint');
  
  try {
    await Clerk.load({ 
      allowedRedirectOrigins: CLERK_ALLOWED_DOMAINS.map(d=>`https://${d}`) 
    });
  } catch(e) {
    loadingHint.textContent = 'Auth service unavailable. Check Clerk key.';
    loadingHint.style.color = '#e05555';
    console.error('Clerk load error:', e);
    return;
  }

  // If already signed in, redirect to dashboard
  if (Clerk.user) {
    window.location.href = DASHBOARD_URL;
    return;
  }

  loadingHint.textContent = 'Private Command Center';
  
  Clerk.mountSignIn(document.getElementById('clerk-sign-in-container'), {
    appearance: clerkAppearance,
    routing: 'hash',                    // ← changed from 'virtual' to 'hash'
    afterSignInUrl: DASHBOARD_URL,
    afterSignUpUrl: DASHBOARD_URL,
    // ← removed redirectUrl entirely
  });

  Clerk.addListener(({ user }) => {
    if (user) {
      window.location.href = DASHBOARD_URL;
    }
  });
});
</script>

</body>
</html>
